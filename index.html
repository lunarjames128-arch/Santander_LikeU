
<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abriendo sitio oficial...</title>
    <style>
        body {
            background-color: #0b132b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        .card {
            background-color: #1c2541;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
        .btn {
            background-color: #00b4d8;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
    <script>
        // PEGA TU LINK DE AFILIADO REAL ENTRE LAS COMILLAS DE ABAJO
        var urlFinal = "https://vdmarketing.postaffiliatepro.com/scripts/qzcw1549?a_aid=Eloy00&a_bid=d20ae98c&chan=code4"; 

        function redirigir() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isAndroid = ua.indexOf("Android") > -1;
            
            if (isAndroid) {
                // Esto fuerza a Android a abrir Google Chrome directamente
                var limpiaUrl = urlFinal.replace(/^https?:\/\//, "");
                window.location.href = "intent://" + limpiaUrl + "#Intent;scheme=https;package=com.android.chrome;end";
            } else {
                // Si es iPhone o PC, abre el link normal
                window.location.href = urlFinal;
            }
        }
        
        // Ejecuta la redirección automáticamente al cargar la página
        window.onload = function() {
            setTimeout(redirigir, 500);
        };
    </script>
</head>
<body>
    <div class="card">
        <h2>Cargando sitio seguro...</h2>
        <p>Si la página no carga automáticamente en tu navegador, presiona el botón de abajo:</p>
        <a href="#" onclick="redirigir(); return false;" class="btn">Presionar aquí para continuar</a>
    </div>
</body>
</html>
